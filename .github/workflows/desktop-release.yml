name: Publish selected QingYu test packages
on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OFFICIAL_BUILD_MARKER: ${{ secrets.SIYUAN_UNLOCK_OFFICIAL_BUILD }}
      VERSION: ${{ inputs.version }}
      BUILD_COMMIT: 502bf453862091f4a03bd4d5fd3849563ab963d6
      ANDROID_RUN: '45742137048'
      MACOS_RUN: '45742137051'
    steps:
      - name: Download the two successful builds
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = appdev/siyuan-unlock
          test -n "$OFFICIAL_BUILD_MARKER"
          test "$VERSION" = v3.8.12
          for run in "$ANDROID_RUN" "$MACOS_RUN"; do
            gh run view "$run" --repo "$GITHUB_REPOSITORY" --json status,conclusion,headSha |
              jq -e --arg commit "$BUILD_COMMIT" '.status=="completed" and .conclusion=="success" and .headSha==$commit'
          done
          gh run download "$ANDROID_RUN" --repo "$GITHUB_REPOSITORY" +            --name qingyu-android-arm64-appdev-v3.8.12-test --dir "$RUNNER_TEMP/android"
          gh run download "$MACOS_RUN" --repo "$GITHUB_REPOSITORY" +            --name qingyu-macos-arm64-v3.8.12-test --dir "$RUNNER_TEMP/macos"

      - name: Verify APK, DMG and bundled QingYu code
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=("$RUNNER_TEMP/android/"*.apk)
          dmgs=("$RUNNER_TEMP/macos/"*.dmg)
          test "${#apks[@]}" -eq 1
          test "${#dmgs[@]}" -eq 1
          mkdir "$RUNNER_TEMP/dmg-mount" "$RUNNER_TEMP/publish"
          hdiutil verify "${dmgs[0]}"
          hdiutil attach -readonly -nobrowse -mountpoint "$RUNNER_TEMP/dmg-mount" "${dmgs[0]}"
          trap 'hdiutil detach "$RUNNER_TEMP/dmg-mount"' EXIT
          apps=("$RUNNER_TEMP/dmg-mount/"*.app)
          test "${#apps[@]}" -eq 1
          codesign --verify --deep --strict "${apps[0]}"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "${apps[0]}/Contents/Info.plist")" = 3.8.12
          file "${apps[0]}/Contents/Resources/kernel/SiYuan-Kernel" | grep -F arm64
          python3 - "${apks[0]}" "${apps[0]}" <<'PY'
          import io
          from pathlib import Path
          import sys
          import zipfile

          def verify_renderer(names, read, target):
              scripts = [name for name in names if f"stage/build/{target}/" in name and name.endswith(".js")]
              for marker in (b"data-switch-to-qingyu", b"/api/sync/loginQingYu"):
                  assert any(marker in read(name) for name in scripts), (target, marker)

          apk, app = map(Path, sys.argv[1:])
          with zipfile.ZipFile(apk) as archive:
              assert "lib/arm64-v8a/libgojni.so" in archive.namelist()
              with zipfile.ZipFile(io.BytesIO(archive.read("assets/app.zip"))) as renderer:
                  verify_renderer(renderer.namelist(), renderer.read, "mobile")
          resources = app / "Contents/Resources"
          assert (resources / "stage/ocr/runtime/darwin-arm64/libonnxruntime.dylib").is_file()
          assert list((resources / "stage/ocr/models").glob("*/det/inference.onnx"))
          verify_renderer(
              (str(path.relative_to(resources)) for path in (resources / "stage/build/app").glob("*.js")),
              lambda name: (resources / name).read_bytes(),
              "app",
          )
          print("Verified QingYu in both packages, Android ARM64 kernel, and macOS OCR runtime.")
          PY
          cp "${apks[0]}" "$RUNNER_TEMP/publish/siyuan-unlock-v3.8.12-qingyu-test-android-arm64-appdev.apk"
          cp "${dmgs[0]}" "$RUNNER_TEMP/publish/siyuan-unlock-v3.8.12-qingyu-test-mac-arm64.dmg"

      - name: Attach two test packages to the release and verify SHA-256
        shell: bash
        run: |
          set -euo pipefail
          for asset in "$RUNNER_TEMP/publish/"*; do
            name=$(basename "$asset")
            hash=$(shasum -a 256 "$asset" | awk '{print $1}')
            stored=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" |
              jq -r --arg name "$name" '.assets[] | select(.name==$name) | .digest')
            if [[ -z "$stored" ]]; then
              gh release upload "$VERSION" "$asset" --repo "$GITHUB_REPOSITORY"
              stored=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$VERSION" |
                jq -r --arg name "$name" '.assets[] | select(.name==$name) | .digest')
            fi
            test "$stored" = "sha256:$hash"
            printf 'Verified %s (%s)\n' "$name" "$stored"
          done
