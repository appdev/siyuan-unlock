name: Release Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "release version/tag"
        required: true

# This is the configuration used by the successful official v3.8.7 release
# (siyuan-note/siyuan/actions/runs/38717437695), separate from release source.
env:
  DOCKER_CONFIGURATION_COMMIT: a5ed54310cc2b8daf2fb39e31cd25e54d57f7a43

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            id: amd64
            upstream-cache: sha256:6d990db2c9cd299983f1366b0984d398c39f4d07736102731fea2586ad27678e
            runner: ubuntu-24.04
          - platform: linux/arm64
            id: arm64
            upstream-cache: sha256:4c04549db739755d7670519560b30547084ff292d91bae13de1946b1ea650a43
            runner: ubuntu-24.04-arm
          - platform: linux/arm/v7
            id: armv7
            upstream-cache: sha256:a49927b20fb5e02f8c1db81042c4e9fbec9c465e9ee5215e207b0965edb11ece
            runner: ubuntu-24.04
          - platform: linux/arm/v8
            id: armv8
            upstream-cache: sha256:f927df7d816bd4aa9929549c4f195af3a2bc6744fc018d9fc8b9cc4933c405f9
            runner: ubuntu-24.04

    permissions:
      packages: write
      contents: read

    steps:
      - name: Verify official repository
        shell: bash
        env:
          OFFICIAL_BUILD_MARKER: ${{ secrets.SIYUAN_UNLOCK_OFFICIAL_BUILD }}
        run: |
          if [[ "${GITHUB_REPOSITORY}" != "appdev/siyuan-unlock" || -z "${OFFICIAL_BUILD_MARKER}" ]]; then
            echo "::error::This release workflow can only run in the official repository."
            exit 1
          fi

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # this might remove tools that are actually needed,
          # if set to "true" but frees about 6 GB
          tool-cache: false

          # all of these default to true, but feel free to set to
          # "false" if necessary for your workflow
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - uses: actions/checkout@v4
        with:
          path: siyuan-note

      - name: Checkout verified official Docker configuration
        uses: actions/checkout@v4
        with:
          repository: siyuan-note/siyuan
          ref: ${{ env.DOCKER_CONFIGURATION_COMMIT }}
          path: docker-config
          sparse-checkout: |
            Dockerfile
            .dockerignore
            scripts/verify-docker-release.py
            scripts/testdata/docker-ocr
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Clone release source, apply patches and official build configuration
        id: source
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cd "$GITHUB_WORKSPACE/siyuan-note"
          git clone --branch "$VERSION" --depth=1 https://github.com/siyuan-note/siyuan.git
          cd siyuan
          test "$(jq -er .version app/package.json)" = "${VERSION#v}"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          for patch in disable-update default-config mock-vip-user hide-account-entry; do
            git apply "$GITHUB_WORKSPACE/siyuan-note/patches/siyuan/$patch.patch"
          done
          cp "$GITHUB_WORKSPACE/docker-config/Dockerfile" Dockerfile
          cp "$GITHUB_WORKSPACE/docker-config/.dockerignore" .dockerignore
          # v3.8.9 requires Go 1.26.10; keep the verified Docker configuration while refreshing its pinned Go image.
          sed -i 's/sha256:3082400e369fa24d5fc60bca20edab3f6d604e0c5a690ec66b295eff4dd87ade/sha256:9ce231b28998b32e116927c61aa5c406183061d4f3f2d61b292c88e7f6bdf7ca/' Dockerfile
          echo "Source commit: $(git rev-parse HEAD); configuration commit: $DOCKER_CONFIGURATION_COMMIT"
          sha256sum Dockerfile .dockerignore
          git status --short

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ github.workspace }}/siyuan-note/siyuan/kernel/go.mod
          cache-dependency-path: "**/*.sum"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify account-free sync
        shell: bash
        working-directory: ${{ github.workspace }}/siyuan-note
        run: bash scripts/check-account-free.sh siyuan

      - name: Set up QEMU
        if: startsWith(matrix.platform, 'linux/arm/')
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PWD }}

      - name: Build and push platform by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}/siyuan-note/siyuan
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ secrets.DOCKER_HUB_USER }}/siyuan-unlock,push-by-digest=true,name-canonical=true,push=true
          provenance: mode=min
          # Pin caches from the same verified official run; mutable cache tags drift.
          cache-from: |
            type=registry,ref=b3log/siyuan@${{ matrix.upstream-cache }}
            type=gha,scope=siyuan-unlock-official-${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=siyuan-unlock-official-${{ matrix.id }}

      - name: Verify kernel and real OCR using official release checks
        shell: bash
        env:
          IMAGE: ${{ secrets.DOCKER_HUB_USER }}/siyuan-unlock
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ inputs.version }}
          PLATFORM: ${{ matrix.platform }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("docker-config/scripts/verify-docker-release.py")
          source = path.read_text()
          old = '        block = request(base, "/api/filetree/createDocWithMd", token,\n                        {"notebook": notebook["notebook"]["id"], "path": "/Docker smoke", "markdown": "Docker OCR smoke 123"})'
          new = '        block = None\n        for attempt in range(1, 31):\n            try:\n                block = request(base, "/api/filetree/createDocWithMd", token,\n                                {"notebook": notebook["notebook"]["id"], "path": "/Docker smoke", "markdown": "Docker OCR smoke 123"})\n                break\n            except ValueError as error:\n                if "indexUnavailable" not in str(error) or attempt == 30:\n                    raise\n                print(f"Document index not ready; retrying in 10 seconds (attempt {attempt + 1}/30)", flush=True)\n                time.sleep(10)\n        if block is None:\n            raise RuntimeError("Document index did not become ready")'
          if old not in source:
              raise SystemExit("verification script context not found")
          path.write_text(source.replace(old, new, 1))
          PY
          for attempt in $(seq 1 30); do
            if python3 docker-config/scripts/verify-docker-release.py verify \
              --image "$IMAGE@$DIGEST" --version "${VERSION#v}" --platform "$PLATFORM" \
              --source-commit "$SOURCE_COMMIT" --configuration-commit "$DOCKER_CONFIGURATION_COMMIT" \
              --run-id "$GITHUB_RUN_ID" --report "$RUNNER_TEMP/docker-verification/report.json"; then
              exit 0
            fi
            if [[ "$attempt" -lt 30 ]]; then
              echo "Verification not ready; retrying in 10 seconds (attempt $((attempt + 1))/30)"
              sleep 10
            fi
          done
          exit 1

      - name: Upload successful verification
        uses: actions/upload-artifact@v4
        with:
          name: docker-verification-${{ matrix.id }}
          path: ${{ runner.temp }}/docker-verification/report.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Preserve verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-diagnostics-${{ github.run_attempt }}-${{ matrix.id }}
          path: ${{ runner.temp }}/docker-verification
          if-no-files-found: ignore
          retention-days: 1

  merge:
    name: Publish verified multi-platform image
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout official release verification
        uses: actions/checkout@v4
        with:
          repository: siyuan-note/siyuan
          ref: ${{ env.DOCKER_CONFIGURATION_COMMIT }}
          sparse-checkout: scripts/verify-docker-release.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download successful verification reports
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/platform-reports
          pattern: docker-verification-*

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PWD }}

      - name: Assemble and publish verified version tags
        shell: bash
        env:
          IMAGE: ${{ secrets.DOCKER_HUB_USER }}/siyuan-unlock
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          python3 scripts/verify-docker-release.py assemble \
            --repository "$IMAGE" --candidate-tag "build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-verified" \
            --version "${VERSION#v}" --source-commit "$SOURCE_COMMIT" \
            --configuration-commit "$DOCKER_CONFIGURATION_COMMIT" --run-id "$GITHUB_RUN_ID" \
            --reports "$RUNNER_TEMP/platform-reports" --report "$RUNNER_TEMP/docker-verification.json"
          RELEASE_IMAGE=$(jq -er .image "$RUNNER_TEMP/docker-verification.json")
          python3 scripts/verify-docker-release.py promote \
            --image "$RELEASE_IMAGE" --version "${VERSION#v}" \
            --report "$RUNNER_TEMP/docker-verification.json"

      - name: Preserve release verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-release-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docker-verification.json
          if-no-files-found: ignore
          retention-days: 1

            if python3 docker-config/scripts/verify-docker-release.py verify \
              --image "$IMAGE@$DIGEST" --version "${VERSION#v}" --platform "$PLATFORM" \
              --source-commit "$SOURCE_COMMIT" --configuration-commit "$DOCKER_CONFIGURATION_COMMIT" \
              --run-id "$GITHUB_RUN_ID" --report "$RUNNER_TEMP/docker-verification/report.json"; then
              exit 0
            fi
            if [[ "$attempt" -lt 30 ]]; then
              echo "Verification not ready; retrying in 10 seconds (attempt $((attempt + 1))/30)"
              sleep 10
            fi
          done
          exit 1

      - name: Upload successful verification
        uses: actions/upload-artifact@v4
        with:
          name: docker-verification-${{ matrix.id }}
          path: ${{ runner.temp }}/docker-verification/report.json
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      - name: Preserve verification diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-diagnostics-${{ github.run_attempt }}-${{ matrix.id }}
          path: ${{ runner.temp }}/docker-verification
          if-no-files-found: ignore
          retention-days: 1

  merge:
    name: Publish verified multi-platform image
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout official release verification
        uses: actions/checkout@v4
        with:
          repository: siyuan-note/siyuan
          ref: ${{ env.DOCKER_CONFIGURATION_COMMIT }}
          sparse-checkout: scripts/verify-docker-release.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download successful verification reports
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/platform-reports
          pattern: docker-verification-*

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_PWD }}

      - name: Assemble and publish verified version tags
        shell: bash
        env:
          IMAGE: ${{ secrets.DOCKER_HUB_USER }}/siyuan-unlock
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ needs.build.outputs.source_commit }}
        run: |
          python3 scripts/verify-docker-release.py assemble \
            --repository "$IMAGE" --candidate-tag "build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-verified" \
            --version "${VERSION#v}" --source-commit "$SOURCE_COMMIT" \
            --configuration-commit "$DOCKER_CONFIGURATION_COMMIT" --run-id "$GITHUB_RUN_ID" \
            --reports "$RUNNER_TEMP/platform-reports" --report "$RUNNER_TEMP/docker-verification.json"
          RELEASE_IMAGE=$(jq -er .image "$RUNNER_TEMP/docker-verification.json")
          python3 scripts/verify-docker-release.py promote \
            --image "$RELEASE_IMAGE" --version "${VERSION#v}" \
            --report "$RUNNER_TEMP/docker-verification.json"

      - name: Preserve release verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-release-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docker-verification.json
          if-no-files-found: ignore
          retention-days: 1
